data_source:
  sacc_data_file: /Users/nramachandra/github-integration/firecrown/tests/sacc_data.hdf5
two_point_factory:
  correlation_space: real
  weak_lensing_factories:
  - type_source: default
    per_bin_systematics:
    - type: MultiplicativeShearBiasFactory
    - type: PhotoZShiftFactory
    global_systematics:
    - type: LinearAlignmentSystematicFactory
      alphag: 1.0
  number_counts_factories:
  - type_source: default
    per_bin_systematics:
    - type: PhotoZShiftFactory
    global_systematics: []
    include_rsd: false
ccl_factory:
  creation_mode: pure_ccl_mode
  require_nonlinear_pk: true
  amplitude_parameter: sigma8
  pure_ccl_transfer_function: boltzmann_camb
